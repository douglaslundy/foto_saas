events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver so upstreams are re-resolved after container restarts
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Auth (GoTrue)
    server {
        listen 80;

        location /auth/v1/ {
            rewrite ^/auth/v1/(.*) /$1 break;
            proxy_pass http://fotosaas-auth:9999;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API (PostgREST)
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*) /$1 break;
            proxy_pass http://fotosaas-rest:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Storage API
        location /storage/v1/ {
            rewrite ^/storage/v1/(.*) /$1 break;
            proxy_pass http://fotosaas-storage:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 52m;
        }

        # Next.js App (catch-all)
        location / {
            set $app fotosaas-app;
            proxy_pass http://$app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            client_max_body_size 52m;
        }
    }
}
