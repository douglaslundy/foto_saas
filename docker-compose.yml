# =============================================================
# FotoSaaS — Docker Compose (ambiente de teste local)
# =============================================================
# Porta da aplicação : http://localhost:3001
# API Supabase       : http://localhost:8100
# MailHog (emails)   : http://localhost:8126
# PostgreSQL externo : localhost:5434
# Redis externo      : localhost:6380
# Face service       : http://localhost:8001
#
# Iniciar: docker compose up --build
# Parar  : docker compose down
# Reset DB: docker compose down -v && docker compose up --build
# =============================================================

name: fotosaas

services:

  # ── PostgreSQL (Supabase) ──────────────────────────────────
  fotosaas-db:
    image: supabase/postgres:15.1.0.117
    container_name: fotosaas-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: fotosaas_dev_pass_2024
      PGPASSWORD: fotosaas_dev_pass_2024
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
      JWT_EXP: 3600
    volumes:
      - fotosaas-db-data:/var/lib/postgresql/data
      - ./docker/db/00-schema.sql:/docker-entrypoint-initdb.d/migrations/00-schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/migrations/01-seed.sql:ro
    ports:
      - "5434:5432"

  # ── Supabase Auth (GoTrue) ─────────────────────────────────
  fotosaas-auth:
    image: supabase/gotrue:v2.151.0
    container_name: fotosaas-auth
    restart: unless-stopped
    depends_on:
      fotosaas-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8100
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:fotosaas_dev_pass_2024@fotosaas-db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3001
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3001,http://localhost:8100"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: fotosaas-mailhog
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: FotoSaaS
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@fotosaas.local
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 6

  # ── PostgREST (REST API) ───────────────────────────────────
  fotosaas-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: fotosaas-rest
    restart: unless-stopped
    depends_on:
      fotosaas-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:fotosaas_dev_pass_2024@fotosaas-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_SERVER_PORT: 3000

  # ── Supabase Storage ───────────────────────────────────────
  fotosaas-storage:
    image: supabase/storage-api:v1.0.6
    container_name: fotosaas-storage
    restart: unless-stopped
    depends_on:
      fotosaas-db:
        condition: service_healthy
      fotosaas-rest:
        condition: service_started
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiJ-e3dXSw6ioTTdqpA1uXhBlUCgAK9YVHW_70
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hj04zWl196z2-SBc0
      POSTGREST_URL: http://fotosaas-rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters
      DATABASE_URL: postgres://postgres:fotosaas_dev_pass_2024@fotosaas-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - fotosaas-storage-data:/var/lib/storage

  # ── Nginx (API Gateway — emula Supabase API) ───────────────
  fotosaas-nginx:
    image: nginx:alpine
    container_name: fotosaas-nginx
    restart: unless-stopped
    depends_on:
      - fotosaas-auth
      - fotosaas-rest
      - fotosaas-storage
    ports:
      - "8100:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # ── Next.js App ────────────────────────────────────────────
  fotosaas-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:8100
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRFA0NiJ-e3dXSw6ioTTdqpA1uXhBlUCgAK9YVHW_70
        NEXT_PUBLIC_APP_URL: http://localhost:3001
        NEXT_PUBLIC_ROOT_DOMAIN: localhost:3001
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fotosaas_placeholder_key_2024
    container_name: fotosaas-app
    restart: unless-stopped
    depends_on:
      - fotosaas-nginx
    # localhost dentro do container → IP do host (Docker Desktop Windows/Mac)
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # Server-side only (não embutidos no bundle)
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hj04zWl196z2-SBc0
      STRIPE_SECRET_KEY: sk_test_fotosaas_placeholder_key_2024
      STRIPE_WEBHOOK_SECRET: whsec_fotosaas_local_webhook_secret_2024
      MERCADOPAGO_ACCESS_TOKEN: TEST-fotosaas-mercadopago-token-2024
      MERCADOPAGO_WEBHOOK_SECRET: fotosaas_mp_webhook_local_2024
      SMTP_HOST: fotosaas-mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@fotosaas.local
      FACE_RECOGNITION_SERVICE_URL: http://fotosaas-face:8000
      REDIS_URL: redis://fotosaas-redis:6379
    ports:
      - "3001:3001"

  # ── Redis ──────────────────────────────────────────────────
  fotosaas-redis:
    image: redis:7-alpine
    container_name: fotosaas-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - fotosaas-redis-data:/data

  # ── MailHog (captura emails em dev) ───────────────────────
  fotosaas-mailhog:
    image: mailhog/mailhog:latest
    container_name: fotosaas-mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP (usado pelos serviços internos)
      - "8126:8025"   # Web UI → http://localhost:8126

  # ── Serviço de reconhecimento facial (Python) ─────────────
  # Inicie separadamente: docker compose --profile full up fotosaas-face --build
  fotosaas-face:
    profiles: ["full"]
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: fotosaas-face
    restart: unless-stopped
    depends_on:
      - fotosaas-redis
    environment:
      REDIS_URL: redis://fotosaas-redis:6379
    ports:
      - "8001:8000"

volumes:
  fotosaas-db-data:
  fotosaas-storage-data:
  fotosaas-redis-data:
